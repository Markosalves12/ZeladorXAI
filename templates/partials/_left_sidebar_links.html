{% load static %}
<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1>{{ app_name }}</h1>
      </div>
      {% if link_tipos != None %}
        <div class="col-sm-6 ">
          <div class="btn-group breadcrumb float-sm-right">
            <button type="button" class="btn btn-default dropdown-toggle dropdown-icon" data-toggle="dropdown">
              {{ link_tipos.0.nome }}
            </button>
            <div class="dropdown-menu" style="max-width: 250px; word-wrap: break-word;">
              {% for value in link_tipos|slice:"1:" %}
                <a class="dropdown-item" href="{{ value.link }}" style="white-space: normal; text-align: left; overflow-wrap: break-word;">
                  {{ value.nome }}
                </a>
              {% endfor %}
            </div>
          </div>
        </div>
      {% endif %}
    </div>
  </div><!-- /.container-fluid -->
</section>
