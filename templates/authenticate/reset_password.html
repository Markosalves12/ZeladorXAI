{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-133LPT73ZQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-133LPT73ZQ');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ application }} | Login</title>
  <link rel="shortcut icon" href="{% static 'dist/img/favicon-16x16.png' %}" />

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
<!--  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">-->
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  {% include 'partials/_modern_theme.html' %}
</head>
<body class="hold-transition login-page">
{% include 'partials/_messages.html' %}
<div class="login-box">
  <div class="login-logo">
    <a href="{% url 'login' %}"><b>Zelador</b>X</a>
  </div>

  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <form action="{% url 'update_password' token %}" method="POST" enctype="multipart/form-data">
        <div class="card-body">
          <div class="form-group">
            {% csrf_token %}
              <div class="form-group">
                {% for field in forms.visible_fields %}
                  <div class="form-group">
                    <label for="{{ field.id_for_label }}" >
                      {{ field.label }}
                    </label>
                    {{ field }}
                  </div>
                {% endfor %}
              </div>
          </div>
          <div class="modal-footer">
            <button type="POST" class="btn btn-primary">Alterar senha</button>
          </div>
        </div>
      </form>
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
<!-- /.login-box -->

<!-- jQuery -->
<script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
<!-- Bootstrap 4 -->
<script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.min.js' %}"></script>
</body>
</html>
