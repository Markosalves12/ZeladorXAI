{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  {% include 'partials/_header.html' %}
</head>
<body class="hold-transition">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">{{ app_name }}</h3>
        </div>

        <div class="card-body">
          {% include 'partials/_messages.html' %}
          <form action="{{ redirect_url_name }}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in forms.visible_fields %}
              <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
              </div>
            {% endfor %}

            <div class="d-flex justify-content-between">
              {% if redirect_close_button %}
                <a href="{{ redirect_close_button }}" class="btn btn-secondary">Fechar</a>
              {% endif %}
              <button type="submit" class="btn btn-primary">{{ text_button_save }}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% include 'partials/_footer.html' %}


<!-- JS -->
<script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'dist/js/adminlte.min.js' %}"></script>
</body>
</html>
